<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 상세 분석</title>
<style>
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 6px 8px;
    margin: 0;
    line-height: 1.35;
    font-size: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #334155;
  }
  .symbol-name {
    font-size: 1rem;
    font-weight: bold;
  }
  .side-long { color: #22c55e; }
  .side-short { color: #ef4444; }
  .section {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 5px 8px;
    margin-bottom: 5px;
  }
  .section-title {
    font-weight: bold;
    color: #a78bfa;
    margin-bottom: 3px;
    font-size: 0.78rem;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 1px 0;
    border-bottom: 1px dashed #334155;
    font-size: 0.72rem;
  }
  .row:last-child { border-bottom: 0; }
  .label { color: #94a3b8; }
  .value { font-weight: 600; }
  .verdict-box {
    text-align: center;
    padding: 6px;
    border-radius: 5px;
    font-size: 0.9rem;
    font-weight: bold;
    margin: 5px 0;
  }
  .signal-item {
    padding: 2px 0;
    font-size: 0.72rem;
  }
  .btn {
    padding: 5px 10px;
    border-radius: 4px;
    border: 0;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.75rem;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #059669, #22c55e);
    color: white;
  }
  .btn-secondary {
    background: #7c3aed;
    color: white;
  }
  .btn-danger {
    background: #ef4444;
    color: white;
  }
  .loading {
    text-align: center;
    color: #94a3b8;
    padding: 40px;
  }
  .pos-change { color: #22c55e; }
  .neg-change { color: #ef4444; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="symbol-name" id="header-title">📊 로딩...</div>
    <div class="text-sm" id="header-sub" style="color:#94a3b8;font-size:0.85rem"></div>
  </div>
  <button class="btn btn-secondary" onclick="window.close()">✕ 닫기</button>
</div>

<div id="content"><div class="loading">📡 분석 중...</div></div>

<script>
const API_BASE = '/api/v1';

// URL 파라미터!
const params = new URLSearchParams(window.location.search);
const symbol = params.get('symbol');
const side = (params.get('side') || 'LONG').toUpperCase();
const suggestionId = params.get('sid');
const strategyId = params.get('strategy_id');

// 헤더!
document.getElementById('header-title').textContent = `📊 ${symbol || '?'} ${side}`;
document.getElementById('header-title').classList.add(side === 'LONG' ? 'side-long' : 'side-short');
if (strategyId) {
  document.getElementById('header-sub').textContent = `활성 전략 #${strategyId}`;
} else if (suggestionId) {
  document.getElementById('header-sub').textContent = `제안 #${suggestionId}`;
}

// 토큰! (api.js와 동일 키!)
function getToken() {
  return localStorage.getItem('access_token')
      || sessionStorage.getItem('access_token')
      || localStorage.getItem('accessToken')  // 옛 fallback
      || '';
}

async function fetchAnalysis() {
  try {
    const token = getToken();
    const url = strategyId
      ? `${API_BASE}/analysis/strategy/${strategyId}`
      : `${API_BASE}/analysis/symbol/${encodeURIComponent(symbol)}?side=${side}`;
    const r = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="section" style="color:#ef4444">❌ 분석 실패: ${e.message}</div>`;
  }
}

function fmtChange(v) {
  if (v === null || v === undefined) return '<span style="color:#94a3b8">-</span>';
  const cls = v >= 0 ? 'pos-change' : 'neg-change';
  const sign = v >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v}%</span>`;
}

// 가격 표기 (v137): 1 이상 = 소수 4자리 / 1 미만 = 유효숫자 6자리 (알트 저가 대응!)
function fmtPrice(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  const n = Number(v);
  if (n === 0) return '0';
  return Math.abs(n) >= 1 ? String(parseFloat(n.toFixed(4))) : String(parseFloat(n.toPrecision(6)));
}

function render(data) {
  const sa = data.symbol_analysis || {};
  const changes = data.changes || sa.changes || {};
  const rsi = data.rsi_15m ?? sa.rsi_15m;
  const bb = data.bb_15m || sa.bb_15m || {};
  const obv = data.obv_15m || sa.obv_15m || {};
  const macd = data.macd_15m || sa.macd_15m || {};
  const vol = data.volume_15m || sa.volume_15m || {};
  const price = data.price || sa.price || 0;
  const change24 = data.change_24h !== undefined ? data.change_24h : sa.change_24h;
  const judgment = data.judgment || sa.judgment || {};
  const posJudgment = data.position_judgment || null;
  const emaVcp = data.ema_vcp || sa.ema_vcp || {};
  const sarIch = data.sar_ichimoku || sa.sar_ichimoku || {};
  const conf = data.confluence || sa.confluence || {};
  const bbTop = data.bb_top || sa.bb_top || {};
  const pump = data.pump_dump || sa.pump_dump || {};
  const bb4h = data.bb_4h || sa.bb_4h || {};

  let html = '';

  // 활성 전략 정보!
  if (data.current_position_qty !== undefined) {
    html += `
      <div class="section">
        <div class="section-title">💼 포지션 상태</div>
        <div class="row"><span class="label">Status:</span><span class="value">${data.status || '-'}</span></div>
        <div class="row"><span class="label">보유 수량:</span><span class="value">${data.current_position_qty || '0'}</span></div>
        <div class="row"><span class="label">평단가:</span><span class="value">${data.avg_entry_price || '-'}</span></div>
        <div class="row"><span class="label">현재가:</span><span class="value">${data.current_price || '-'}</span></div>
        <div class="row"><span class="label">현재 손익:</span><span class="value">${fmtChange(data.unrealized_pnl_pct)}</span></div>
        <div class="row"><span class="label">최대 수익:</span><span class="value">${data.max_profit_pct !== null ? fmtChange(data.max_profit_pct) : '-'}</span></div>
        <div class="row"><span class="label">최대 손실:</span><span class="value">${data.max_loss_pct !== null ? fmtChange(data.max_loss_pct) : '-'}</span></div>
      </div>
    `;
  }

  // 포지션 판단 (활성 전략!)
  if (posJudgment) {
    html += `
      <div class="verdict-box" style="background:${posJudgment.color}22;border:2px solid ${posJudgment.color};color:${posJudgment.color}">
        ${posJudgment.action === 'URGENT_CLOSE' ? '🚨 위험 청산!' :
          posJudgment.action === 'REVIEW' ? '⚠️ 검토 필요!' :
          posJudgment.action === 'HOLD_STRONG' ? '🎉 강력 보유!' : '💰 보유 유지!'}
      </div>
      <div class="section">
        <div class="section-title">📊 포지션 판단 신호</div>
        ${(posJudgment.signals || []).map(s => `<div class="signal-item">${s}</div>`).join('')}
      </div>
    `;
  }

  // 심볼 가격!
  html += `
    <div class="section">
      <div class="section-title">💰 심볼 가격</div>
      <div class="row"><span class="label">현재가:</span><span class="value">${price || '-'}</span></div>
      <div class="row"><span class="label">24h 변동:</span><span class="value">${fmtChange(change24)}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📈 다중 시간대 변동</div>
      <div class="row"><span class="label">5분:</span><span class="value">${fmtChange(changes.change_5m)}</span></div>
      <div class="row"><span class="label">15분:</span><span class="value">${fmtChange(changes.change_15m)}</span></div>
      <div class="row"><span class="label">1시간:</span><span class="value">${fmtChange(changes.change_1h)}</span></div>
      <div class="row"><span class="label">4시간:</span><span class="value">${fmtChange(changes.change_4h)}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📊 기술 지표 (15분봉)</div>
      <div class="row"><span class="label">RSI:</span><span class="value">${rsi || '-'}
        ${rsi ? (rsi > 70 ? ' <span class="neg-change">(과매수!)</span>' : rsi < 30 ? ' <span class="pos-change">(과매도!)</span>' : ' (중립)') : ''}
      </span></div>
      <div class="row"><span class="label">BB 상단:</span><span class="value">${bb.upper || '-'}</span></div>
      <div class="row"><span class="label">BB 중단:</span><span class="value">${bb.middle || '-'}</span></div>
      <div class="row"><span class="label">BB 하단:</span><span class="value">${bb.lower || '-'}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📈 OBV (매수/매도 압력)</div>
      <div class="row"><span class="label">추세:</span><span class="value">
        ${obv.trend === 'UP' ? '<span class="pos-change">🚀 상승 (매수 압력!)</span>' :
          obv.trend === 'DOWN' ? '<span class="neg-change">📉 하락 (매도 압력!)</span>' :
          obv.trend === 'FLAT' ? '➖ 횡보' : '-'}
      </span></div>
      <div class="row"><span class="label">변동:</span><span class="value">${obv.change_pct !== null && obv.change_pct !== undefined ? fmtChange(obv.change_pct) : '-'}</span></div>
      <div class="row"><span class="label">값:</span><span class="value">${obv.value !== null && obv.value !== undefined ? obv.value : '-'}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📊 MACD (12/26/9)</div>
      <div class="row"><span class="label">추세:</span><span class="value">
        ${macd.trend === 'BULLISH' ? '<span class="pos-change">🚀 Bullish (매수 신호!)</span>' :
          macd.trend === 'BEARISH' ? '<span class="neg-change">📉 Bearish (매도 신호!)</span>' :
          macd.trend === 'NEUTRAL' ? '➖ 중립' : '-'}
      </span></div>
      <div class="row"><span class="label">MACD:</span><span class="value">${macd.macd !== null && macd.macd !== undefined ? macd.macd : '-'}</span></div>
      <div class="row"><span class="label">Signal:</span><span class="value">${macd.signal !== null && macd.signal !== undefined ? macd.signal : '-'}</span></div>
      <div class="row"><span class="label">Histogram:</span><span class="value">
        ${macd.histogram !== null && macd.histogram !== undefined ?
          `<span style="color:${macd.histogram >= 0 ? '#22c55e' : '#ef4444'}">${macd.histogram >= 0 ? '+' : ''}${macd.histogram}</span>` : '-'}
      </span></div>
    </div>

    <div class="section">
      <div class="section-title">📊 Volume 분석</div>
      <div class="row"><span class="label">최근 5봉 평균:</span><span class="value">${vol.recent_avg !== null && vol.recent_avg !== undefined ? vol.recent_avg.toLocaleString() : '-'}</span></div>
      <div class="row"><span class="label">이전 15봉 평균:</span><span class="value">${vol.prev_avg !== null && vol.prev_avg !== undefined ? vol.prev_avg.toLocaleString() : '-'}</span></div>
      <div class="row"><span class="label">Spike 비율:</span><span class="value">
        ${vol.spike_ratio !== null && vol.spike_ratio !== undefined ?
          `<span style="color:${vol.spike_ratio >= 1.5 ? '#22c55e' : vol.spike_ratio < 0.7 ? '#ef4444' : '#94a3b8'}">${vol.spike_ratio}x</span>
           ${vol.spike_ratio >= 2 ? ' <span class="pos-change">🔥 폭증!</span>' : vol.spike_ratio >= 1.5 ? ' <span class="pos-change">📈 급증!</span>' : vol.spike_ratio < 0.5 ? ' <span class="neg-change">💤 급감!</span>' : ''}` : '-'}
      </span></div>
    </div>
  `;

  // 📉 4H 볼밴 중단 이탈 → 반대 밴드 (v143! 실측 표본 최대 = 가장 견고)
  if (bb4h.grade && bb4h.available) {
    const s4 = bb4h.state || {};
    const l4 = bb4h.levels || {};
    const isDown = bb4h.cross === 'DOWN';
    html += `
      <div class="verdict-box" style="background:${bb4h.color}22;border:2px solid ${bb4h.color};color:${bb4h.color}">
        📉 ${bb4h.verdict || ''} (score ${bb4h.score})
      </div>
      <div class="section">
        <div class="section-title">📉 4시간봉 볼밴 (중단 이탈 → 반대 밴드)</div>
        <div class="row"><span class="label">중단 이탈:</span><span class="value">
          ${bb4h.cross ? `${isDown ? '<span class="neg-change">📉 하향 이탈</span>' : '<span class="pos-change">📈 상향 돌파</span>'} (${s4.bars_since_cross}봉 전 = ${(s4.bars_since_cross||0)*4}시간)` : '➖ 없음'}
        </span></div>
        <div class="row"><span class="label">신호 방향:</span><span class="value">${bb4h.signal_side || '-'}</span></div>
        <div class="row"><span class="label">BB 상/중/하:</span><span class="value">${fmtPrice(s4.upper)} / ${fmtPrice(s4.mid)} / ${fmtPrice(s4.lower)}</span></div>
        <div class="row"><span class="label">목표 밴드:</span><span class="value">${fmtPrice(l4.target_band)} ${l4.target_dist_pct !== null && l4.target_dist_pct !== undefined ? `(${l4.target_dist_pct}%)` : ''}</span></div>
        <div class="row"><span class="label">실측 도달률:</span><span class="value"><span class="pos-change">${l4.reach_rate}%</span> <span style="color:#94a3b8">(표본 ${l4.sample_n ? l4.sample_n.toLocaleString() : '-'}건)</span></span></div>
        <div class="row"><span class="label">예상 소요:</span><span class="value">${l4.expected_bars}봉 (약 ${(l4.expected_bars||0)*4}시간)</span></div>
        <div class="row"><span class="label">권장 SL:</span><span class="value">-${l4.sl_pct}% (${fmtPrice(l4.sl_price)})</span></div>
        <div class="row"><span class="label">기대값(수수료 후):</span><span class="value" style="color:#f59e0b">${l4.expected_value_after_fee_pct !== null && l4.expected_value_after_fee_pct !== undefined ? `${l4.expected_value_after_fee_pct > 0 ? '+' : ''}${l4.expected_value_after_fee_pct}%` : '-'}</span></div>
        <div class="row"><span class="label">밴드 도달:</span><span class="value">${s4.band_reached ? '<span style="color:#a855f7">✅ 목표 달성 (청산 검토)</span>' : '➖ 진행 중'}</span></div>
      </div>

      <div class="section">
        <div class="section-title">📉 4H 볼밴 신호</div>
        ${(bb4h.signals || []).map(s => `<div class="signal-item">${s}</div>`).join('')}
      </div>
    `;
  }

  // ⚡ 급등락 실시간 진입 (v141! 시간 민감 = 최상단!)
  if (pump.grade && pump.event) {
    const ev = pump.event || {};
    const lvP = pump.levels || {};
    const m = (ev.tf === '15m' ? pump.m15 : pump.m5) || {};
    html += `
      <div class="verdict-box" style="background:${pump.color}22;border:2px solid ${pump.color};color:${pump.color}">
        ⚡ ${pump.verdict || ''}
      </div>
      <div class="section">
        <div class="section-title">⚡ 급등락 실시간 (${ev.tf} · ${ev.window})</div>
        <div class="row"><span class="label">유형:</span><span class="value">
          ${ev.kind === 'PUMP' ? '<span class="pos-change">🚀 급등 진행 중</span>' : '<span class="neg-change">📉 급락 진행 중</span>'}
          ${ev.change_pct !== undefined ? fmtChange(ev.change_pct) : ''}
        </span></div>
        <div class="row"><span class="label">권고 방향:</span><span class="value">
          ${pump.side === 'LONG' ? '<span class="pos-change">📈 추격 LONG</span>'
            : pump.side === 'SHORT' ? '<span class="neg-change">📉 SHORT</span>'
            : '<span class="neg-change">🚫 진입 비권장</span>'}
        </span></div>
        ${pump.side ? `
        <div class="row"><span class="label">TP / SL:</span><span class="value">+${lvP.tp_pct}% / -${lvP.sl_pct}%</span></div>
        <div class="row"><span class="label">TP / SL 가격:</span><span class="value">${fmtPrice(lvP.tp_price)} / ${fmtPrice(lvP.sl_price)}</span></div>
        <div class="row"><span class="label">TP 선착률:</span><span class="value">${lvP.tp_first_rate !== null && lvP.tp_first_rate !== undefined ? `${lvP.tp_first_rate}%` : '-'} ${lvP.sample_n ? `<span style="color:#94a3b8">(표본 ${lvP.sample_n}건)</span>` : ''}</span></div>
        <div class="row"><span class="label">기대값(수수료 전):</span><span class="value">${lvP.expected_value_pct !== null && lvP.expected_value_pct !== undefined ? fmtChange(lvP.expected_value_pct) : '-'}</span></div>
        <div class="row"><span class="label" style="color:#f59e0b">기대값(수수료 후):</span><span class="value" style="color:#f59e0b">${lvP.expected_value_after_fee_pct !== null && lvP.expected_value_after_fee_pct !== undefined ? `${lvP.expected_value_after_fee_pct > 0 ? '+' : ''}${lvP.expected_value_after_fee_pct}% (슬리피지 별도!)` : '-'}</span></div>
        ` : ''}
        <div class="row"><span class="label">창 내 고가/저가:</span><span class="value">${fmtPrice(m.window_high)} / ${fmtPrice(m.window_low)}</span></div>
        <div class="row"><span class="label">정점 대비:</span><span class="value">${m.from_high_pct !== null && m.from_high_pct !== undefined ? fmtChange(m.from_high_pct) : '-'}</span></div>
      </div>

      ${(pump.retrace && pump.retrace.available) ? `
      <div class="section">
        <div class="section-title">🔄 되돌림 상태 (보유 판단용 — 진입 신호 아님!)</div>
        <div class="row"><span class="label">최근 고점(4시간):</span><span class="value">${fmtPrice(pump.retrace.recent_high)}</span></div>
        <div class="row"><span class="label">현재 되돌림:</span><span class="value">${fmtChange(pump.retrace.retrace_pct)}</span></div>
        <div class="row"><span class="label">실측 고점 회복률:</span><span class="value">
          ${pump.retrace.recovery_rate !== null && pump.retrace.recovery_rate !== undefined
            ? `<span style="color:${pump.retrace.recovery_rate >= 55 ? '#22c55e' : pump.retrace.recovery_rate >= 35 ? '#f59e0b' : '#ef4444'}">${pump.retrace.recovery_rate}%</span> <span style="color:#94a3b8">(표본 ${pump.retrace.sample_n}건)</span>`
            : '-'}
        </span></div>
        <div class="signal-item">${pump.retrace.advice || ''}</div>
      </div>
      ` : ''}

      <div class="section">
        <div class="section-title">⚡ 급등락 신호</div>
        ${(pump.signals || []).map(s => `<div class="signal-item">${s}</div>`).join('')}
      </div>
    `;
  }

  // 🔺 15m 천장/바닥 + 볼밴 중단 (v140! 사장님 주력 = 맨 위에!)
  if (bbTop.grade) {
    const t15 = bbTop.tf_15m || {};
    const mid = bbTop.bb_mid || {};
    const lvB = bbTop.levels || {};
    const h1 = bbTop.tf_1h || {};
    const h4 = bbTop.tf_4h || {};
    const isTop = (bbTop.side || 'SHORT') !== 'LONG';
    const divTxt = (on, name, rate) => on
      ? `<span class="pos-change">✅ ${name} 다이버전스</span> <span style="color:#94a3b8">(적중 ${rate})</span>`
      : `<span style="color:#94a3b8">➖ ${name}</span>`;
    const posTxt = mid.position === 'AT_MID' ? '<span style="color:#a855f7">🎯 BB중단 도달!</span>'
                 : mid.position === 'ABOVE_MID' ? '⬆ 중단 위'
                 : mid.position === 'BELOW_MID' ? '⬇ 중단 아래' : '-';
    html += `
      <div class="verdict-box" style="background:${bbTop.color}22;border:2px solid ${bbTop.color};color:${bbTop.color}">
        🔺 15m ${isTop ? '천장' : '바닥'} ${bbTop.verdict || ''} (score ${bbTop.score})
      </div>
      <div class="section">

  // 🤝 두 전략 합의 (v138!) = 돌파형(EMA/VCP) + 추세추종형(SAR/구름대)

  // 📐 EMA + VCP 멀티 타임프레임 (v137! 4H 나침반 → 1H 작전지도 → 15m 방아쇠!)
  if (emaVcp.grade) {

    const t4 = emaVcp.tf_4h || {};
    const t1 = emaVcp.tf_1h || {};
    const t15 = emaVcp.tf_15m || {};

        <div class="row"><span class="label">추세:</span><span class="value">
          ${t4.direction === 'UP' ? '<span class="pos-change">🚀 상승</span>' :
            t4.direction === 'DOWN' ? '<span class="neg-change">📉 하락</span>' :
            t4.direction === 'FLAT' ? '➖ 횡보' : '-'}
          ${t4.available ? (t4.ok ? ' <span class="pos-change">(진입 허가!)</span>' : ' <span class="neg-change">(역방향 = 금지!)</span>') : ''}
        </span></div>
        <div class="row"><span class="label">EMA50:</span><span class="value">${fmtPrice(t4.ema50)}</span></div>
        <div class="row"><span class="label">EMA50 기울기:</span><span class="value">${t4.slope_pct !== null && t4.slope_pct !== undefined ? fmtChange(t4.slope_pct) : '-'}</span></div>
      </div>

      <div class="section">
        <div class="section-title">🗺 1H 작전지도 (셋업)</div>
        <div class="row"><span class="label">이평선 배열:</span><span class="value">${ox(t1.aligned)} 10/20/50</span></div>
        <div class="row"><span class="label">VCP 수축:</span><span class="value">${ox(t1.vcp_contracting)} ${t1.vcp_ranges ? `${t1.vcp_ranges.join('% → ')}%` : ''} ${t1.vcp_ratio !== null && t1.vcp_ratio !== undefined ? `(비율 ${t1.vcp_ratio})` : ''}</span></div>
        <div class="row"><span class="label">거래량 고갈:</span><span class="value">${ox(t1.volume_dry)} ${t1.vol_ratio !== null && t1.vol_ratio !== undefined ? `${t1.vol_ratio}x` : ''}</span></div>
        <div class="row"><span class="label">첫 반등 필터:</span><span class="value">${t1.first_rally_only ? '<span class="neg-change">⚠️ 첫 파동 = 관망!</span>' : `<span class="pos-change">✅ ${t1.rally_count}번째 파동 = 통과!</span>`}</span></div>
        <div class="row"><span class="label">돌파선:</span><span class="value">${fmtPrice(lv.breakout)}</span></div>
      </div>

      <div class="section">
        <div class="section-title">🔫 15m 방아쇠 (타점/리스크)</div>

          ${t15.breakout_closed ? '<span class="pos-change">🎯 종가 돌파 확정!</span>' :
            t15.breakout_intrabar ? '<span style="color:#f59e0b">⏳ 장중 돌파 중!</span>' : '➖ 대기'}

        <div class="row"><span class="label">손절 기준 (스윙):</span><span class="value">${fmtPrice(lv.stop_loss)} ${lv.risk_pct !== null && lv.risk_pct !== undefined ? `<span class="neg-change">(-${lv.risk_pct}%)</span>` : ''}</span></div>

        <button class="btn btn-primary" onclick="openCreateModalInParent()">
          ✏ 세팅 후 진입

      </button>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
}

// 🌟 v160 사장님 fix (2026-08-16): 대시보드 재귀 검색!
// 문제: 대시보드 → 급락 팝업 → 상세 분석 창
//   → 상세 분석의 window.opener = 급락 팝업 (대시보드 X!)
//   → openCreateModalWithSymbol 함수 = 급락 팝업에 없음 → 실패!
// fix: opener 체인 재귀 검색 → 대시보드 찾기 + postMessage 브로드캐스트!
function findDashboardWindow() {
  const seen = new Set();
  let win = window.opener;
  let depth = 0;
  while (win && !win.closed && depth < 5) {
    if (seen.has(win)) break;
    seen.add(win);
    try {
      if (typeof win.openCreateModalWithSymbol === 'function') {
        return win;
      }
    } catch (_e) { /* cross-origin - skip */ }
    try {
      const next = win.opener;
      if (!next || next === win) break;
      win = next;
    } catch (_e) { break; }
    depth++;
  }
  return null;
}

// 🌟 v160: 세팅 후 진입 = 대시보드 재귀 검색 + 4중 안전!
function openCreateModalInParent() {
  try {
    // 🔹 localStorage 저장 = 항상! (최후 fallback!)
    try {
      localStorage.setItem('pendingCreateModal', JSON.stringify({
        symbol: symbol, side: side, ts: Date.now(),
      }));
    } catch (_e) { /* silent */ }

    // 🔹 1) opener 체인 재귀 검색 → 대시보드 찾기!
    const dashboard = findDashboardWindow();
    if (dashboard) {
      try {
        dashboard.openCreateModalWithSymbol(symbol, side);
        dashboard.focus();
        window.close();
        return;
      } catch (e) {
        console.warn('[v160] 대시보드 함수 호출 실패:', e);
      }
    }

    // 🔹 2) 모든 opener에 postMessage 브로드캐스트!
    try {
      let win = window.opener;
      let depth = 0;
      const seen = new Set();
      while (win && !win.closed && depth < 5) {
        if (seen.has(win)) break;
        seen.add(win);
        try {
          win.postMessage({
            type: 'CREATE_MODAL_WITH_SYMBOL',
            symbol: symbol, side: side,
            source: 'analysis_html',
          }, '*');
        } catch (_e) { /* silent */ }
        try {
          const next = win.opener;
          if (!next || next === win) break;
          win = next;
        } catch (_e) { break; }
        depth++;
      }
      // dashboard 창 focus (있으면!)
      if (dashboard) {
        try { dashboard.focus(); } catch (_e) {}
      }
      setTimeout(() => { try { window.close(); } catch (_e) {} }, 300);
      return;
    } catch (_e) { /* silent */ }

    // 🔹 3) 최후 = alert!
    alert('✅ 심볼 저장 완료! 대시보드에서 「+ 새 전략」 클릭 = 자동 fill!');
  } catch (e) {
    console.warn('openCreateModalInParent 실패:', e);
    alert('❌ 실패: ' + (e.message || e));
  }
}

fetchAnalysis();
// 30초마다 자동 새로고침!
setInterval(fetchAnalysis, 30000);
</script>
