<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 상세 분석</title>
<style>
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 6px 8px;
    margin: 0;
    line-height: 1.35;
    font-size: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #334155;
  }
  .symbol-name {
    font-size: 1rem;
    font-weight: bold;
  }
  .side-long { color: #22c55e; }
  .side-short { color: #ef4444; }
  .section {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 5px 8px;
    margin-bottom: 5px;
  }
  .section-title {
    font-weight: bold;
    color: #a78bfa;
    margin-bottom: 3px;
    font-size: 0.78rem;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 1px 0;
    border-bottom: 1px dashed #334155;
    font-size: 0.72rem;
  }
  .row:last-child { border-bottom: 0; }
  .label { color: #94a3b8; }
  .value { font-weight: 600; }
  .verdict-box {
    text-align: center;
    padding: 6px;
    border-radius: 5px;
    font-size: 0.9rem;
    font-weight: bold;
    margin: 5px 0;
  }
  .signal-item {
    padding: 2px 0;
    font-size: 0.72rem;
  }
  .btn {
    padding: 5px 10px;
    border-radius: 4px;
    border: 0;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.75rem;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #059669, #22c55e);
    color: white;
  }
  .btn-secondary {
    background: #7c3aed;
    color: white;
  }
  .btn-danger {
    background: #ef4444;
    color: white;
  }
  .loading {
    text-align: center;
    color: #94a3b8;
    padding: 40px;
  }
  .pos-change { color: #22c55e; }
  .neg-change { color: #ef4444; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="symbol-name" id="header-title">📊 로딩...</div>
    <div class="text-sm" id="header-sub" style="color:#94a3b8;font-size:0.85rem"></div>
  </div>
  <button class="btn btn-secondary" onclick="window.close()">✕ 닫기</button>
</div>

<div id="content"><div class="loading">📡 분석 중...</div></div>

<script>
const API_BASE = '/api/v1';

// URL 파라미터!
const params = new URLSearchParams(window.location.search);
const symbol = params.get('symbol');
const side = (params.get('side') || 'LONG').toUpperCase();
const suggestionId = params.get('sid');
const strategyId = params.get('strategy_id');

// 헤더!
document.getElementById('header-title').textContent = `📊 ${symbol || '?'} ${side}`;
document.getElementById('header-title').classList.add(side === 'LONG' ? 'side-long' : 'side-short');
if (strategyId) {
  document.getElementById('header-sub').textContent = `활성 전략 #${strategyId}`;
} else if (suggestionId) {
  document.getElementById('header-sub').textContent = `제안 #${suggestionId}`;
}

// 토큰! (api.js와 동일 키!)
function getToken() {
  return localStorage.getItem('access_token')
      || sessionStorage.getItem('access_token')
      || localStorage.getItem('accessToken')  // 옛 fallback
      || '';
}

async function fetchAnalysis() {
  try {
    const token = getToken();
    const url = strategyId
      ? `${API_BASE}/analysis/strategy/${strategyId}`
      : `${API_BASE}/analysis/symbol/${encodeURIComponent(symbol)}?side=${side}`;
    const r = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="section" style="color:#ef4444">❌ 분석 실패: ${e.message}</div>`;
  }
}

function fmtChange(v) {
  if (v === null || v === undefined) return '<span style="color:#94a3b8">-</span>';
  const cls = v >= 0 ? 'pos-change' : 'neg-change';
  const sign = v >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v}%</span>`;
}

function render(data) {
  const sa = data.symbol_analysis || {};
  const changes = data.changes || sa.changes || {};
  const rsi = data.rsi_15m ?? sa.rsi_15m;
  const bb = data.bb_15m || sa.bb_15m || {};
  const obv = data.obv_15m || sa.obv_15m || {};
  const macd = data.macd_15m || sa.macd_15m || {};
  const vol = data.volume_15m || sa.volume_15m || {};
  const price = data.price || sa.price || 0;
  const change24 = data.change_24h !== undefined ? data.change_24h : sa.change_24h;
  const judgment = data.judgment || sa.judgment || {};
  const posJudgment = data.position_judgment || null;

  let html = '';

  // 활성 전략 정보!
  if (data.current_position_qty !== undefined) {
    html += `
      <div class="section">
        <div class="section-title">💼 포지션 상태</div>
        <div class="row"><span class="label">Status:</span><span class="value">${data.status || '-'}</span></div>
        <div class="row"><span class="label">보유 수량:</span><span class="value">${data.current_position_qty || '0'}</span></div>
        <div class="row"><span class="label">평단가:</span><span class="value">${data.avg_entry_price || '-'}</span></div>
        <div class="row"><span class="label">현재가:</span><span class="value">${data.current_price || '-'}</span></div>
        <div class="row"><span class="label">현재 손익:</span><span class="value">${fmtChange(data.unrealized_pnl_pct)}</span></div>
        <div class="row"><span class="label">최대 수익:</span><span class="value">${data.max_profit_pct !== null ? fmtChange(data.max_profit_pct) : '-'}</span></div>
        <div class="row"><span class="label">최대 손실:</span><span class="value">${data.max_loss_pct !== null ? fmtChange(data.max_loss_pct) : '-'}</span></div>
      </div>
    `;
  }

  // 포지션 판단 (활성 전략!)
  if (posJudgment) {
    html += `
      <div class="verdict-box" style="background:${posJudgment.color}22;border:2px solid ${posJudgment.color};color:${posJudgment.color}">
        ${posJudgment.action === 'URGENT_CLOSE' ? '🚨 위험 청산!' :
          posJudgment.action === 'REVIEW' ? '⚠️ 검토 필요!' :
          posJudgment.action === 'HOLD_STRONG' ? '🎉 강력 보유!' : '💰 보유 유지!'}
      </div>
      <div class="section">
        <div class="section-title">📊 포지션 판단 신호</div>
        ${(posJudgment.signals || []).map(s => `<div class="signal-item">${s}</div>`).join('')}
      </div>
    `;
  }

  // 심볼 가격!
  html += `
    <div class="section">
      <div class="section-title">💰 심볼 가격</div>
      <div class="row"><span class="label">현재가:</span><span class="value">${price || '-'}</span></div>
      <div class="row"><span class="label">24h 변동:</span><span class="value">${fmtChange(change24)}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📈 다중 시간대 변동</div>
      <div class="row"><span class="label">5분:</span><span class="value">${fmtChange(changes.change_5m)}</span></div>
      <div class="row"><span class="label">15분:</span><span class="value">${fmtChange(changes.change_15m)}</span></div>
      <div class="row"><span class="label">1시간:</span><span class="value">${fmtChange(changes.change_1h)}</span></div>
      <div class="row"><span class="label">4시간:</span><span class="value">${fmtChange(changes.change_4h)}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📊 기술 지표 (15분봉)</div>
      <div class="row"><span class="label">RSI:</span><span class="value">${rsi || '-'}
        ${rsi ? (rsi > 70 ? ' <span class="neg-change">(과매수!)</span>' : rsi < 30 ? ' <span class="pos-change">(과매도!)</span>' : ' (중립)') : ''}
      </span></div>
      <div class="row"><span class="label">BB 상단:</span><span class="value">${bb.upper || '-'}</span></div>
      <div class="row"><span class="label">BB 중단:</span><span class="value">${bb.middle || '-'}</span></div>
      <div class="row"><span class="label">BB 하단:</span><span class="value">${bb.lower || '-'}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📈 OBV (매수/매도 압력)</div>
      <div class="row"><span class="label">추세:</span><span class="value">
        ${obv.trend === 'UP' ? '<span class="pos-change">🚀 상승 (매수 압력!)</span>' :
          obv.trend === 'DOWN' ? '<span class="neg-change">📉 하락 (매도 압력!)</span>' :
          obv.trend === 'FLAT' ? '➖ 횡보' : '-'}
      </span></div>
      <div class="row"><span class="label">변동:</span><span class="value">${obv.change_pct !== null && obv.change_pct !== undefined ? fmtChange(obv.change_pct) : '-'}</span></div>
      <div class="row"><span class="label">값:</span><span class="value">${obv.value !== null && obv.value !== undefined ? obv.value : '-'}</span></div>
    </div>

    <div class="section">
      <div class="section-title">📊 MACD (12/26/9)</div>
      <div class="row"><span class="label">추세:</span><span class="value">
        ${macd.trend === 'BULLISH' ? '<span class="pos-change">🚀 Bullish (매수 신호!)</span>' :
          macd.trend === 'BEARISH' ? '<span class="neg-change">📉 Bearish (매도 신호!)</span>' :
          macd.trend === 'NEUTRAL' ? '➖ 중립' : '-'}
      </span></div>
      <div class="row"><span class="label">MACD:</span><span class="value">${macd.macd !== null && macd.macd !== undefined ? macd.macd : '-'}</span></div>
      <div class="row"><span class="label">Signal:</span><span class="value">${macd.signal !== null && macd.signal !== undefined ? macd.signal : '-'}</span></div>
      <div class="row"><span class="label">Histogram:</span><span class="value">
        ${macd.histogram !== null && macd.histogram !== undefined ?
          `<span style="color:${macd.histogram >= 0 ? '#22c55e' : '#ef4444'}">${macd.histogram >= 0 ? '+' : ''}${macd.histogram}</span>` : '-'}
      </span></div>
    </div>

    <div class="section">
      <div class="section-title">📊 Volume 분석</div>
      <div class="row"><span class="label">최근 5봉 평균:</span><span class="value">${vol.recent_avg !== null && vol.recent_avg !== undefined ? vol.recent_avg.toLocaleString() : '-'}</span></div>
      <div class="row"><span class="label">이전 15봉 평균:</span><span class="value">${vol.prev_avg !== null && vol.prev_avg !== undefined ? vol.prev_avg.toLocaleString() : '-'}</span></div>
      <div class="row"><span class="label">Spike 비율:</span><span class="value">
        ${vol.spike_ratio !== null && vol.spike_ratio !== undefined ?
          `<span style="color:${vol.spike_ratio >= 1.5 ? '#22c55e' : vol.spike_ratio < 0.7 ? '#ef4444' : '#94a3b8'}">${vol.spike_ratio}x</span>
           ${vol.spike_ratio >= 2 ? ' <span class="pos-change">🔥 폭증!</span>' : vol.spike_ratio >= 1.5 ? ' <span class="pos-change">📈 급증!</span>' : vol.spike_ratio < 0.5 ? ' <span class="neg-change">💤 급감!</span>' : ''}` : '-'}
      </span></div>
    </div>
  `;

  // 심볼 진입 판단!
  if (judgment.verdict) {
    html += `
      <div class="verdict-box" style="background:${judgment.color}22;border:2px solid ${judgment.color};color:${judgment.color}">
        ${judgment.verdict} (score ${judgment.score})
      </div>
      <div class="section">
        <div class="section-title">📊 진입 판단 신호</div>
        ${(judgment.signals || []).map(s => `<div class="signal-item">${s}</div>`).join('')}
      </div>
    `;
  }

  // 액션 버튼!
  html += `
    <div class="section" style="text-align:center;background:transparent;border:0">
      ${strategyId ? `
        <button class="btn btn-danger" onclick="alert('긴급 청산은 대시보드에서 실행!')">
          🚨 대시보드에서 긴급 청산
        </button>
      ` : `
        <button class="btn btn-primary" onclick="openCreateModalInParent()">
          ✏ 세팅 후 진입
        </button>
      `}
      <button class="btn btn-secondary" onclick="fetchAnalysis()">
        🔄 새로고침
      </button>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
}

// 🌟 v134d: 세팅 후 진입 = 대시보드 새 전략 modal 자동 열기 + fill!
function openCreateModalInParent() {
  try {
    if (!window.opener || window.opener.closed) {
      alert('❌ 대시보드 창이 닫혔음! 대시보드를 새로 열어주세요.');
      return;
    }
    // 대시보드 창의 함수 호출!
    if (typeof window.opener.openCreateModalWithSymbol === 'function') {
      window.opener.openCreateModalWithSymbol(symbol, side);
      window.opener.focus();
      window.close();
    } else {
      // fallback = 새 창에서 직접 실행 시도!
      alert('❌ 대시보드에서 새 전략 modal 열기 함수 없음! 대시보드에서 직접 열어주세요.');
      window.opener.focus();
    }
  } catch (e) {
    console.warn('openCreateModalInParent 실패:', e);
    alert('❌ 대시보드로 이동 실패: ' + (e.message || e));
  }
}

fetchAnalysis();
// 30초마다 자동 새로고침!
setInterval(fetchAnalysis, 30000);
</script>
</body>
</html>
