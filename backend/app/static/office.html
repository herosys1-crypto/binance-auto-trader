<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏢 자동매매 사무실</title>
<style>
  :root { --bg:#f8f3ea; --wall:#efe4d2; --ink:#334155; --muted:#64748b; --card:#fffdf8; }
  html, body { overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; padding: 10px; font-size: 13px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .board { background:#3f3a32; color:#fef3c7; border-radius:10px; padding:8px 16px; text-align:center; box-shadow:0 2px 0 #2a261f; }
  .board b { font-size:18px; letter-spacing:1px } .board div { font-size:11px; opacity:.85 }
  .summary { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border-radius:999px; padding:2px 10px; font-size:12px; border:1px solid #cbd5e1; background:#fff; }
  .wrap { display:flex; gap:10px; align-items:flex-start; }
  .office { flex:1 1 auto; min-width:0; background: var(--wall); border-radius:14px; padding:10px; display:grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap:10px; }
  .room { border-radius:12px; padding:8px; border:2px dashed rgba(0,0,0,.08); }
  .room h3 { margin:0 0 6px; font-size:13px; display:flex; align-items:center; gap:6px; }
  .desks { display:grid; grid-template-columns: repeat(auto-fill, minmax(min(130px, 100%), 1fr)); gap:8px; }
  .desk { background: var(--card); border-radius:10px; padding:8px 6px 6px; text-align:center; cursor:pointer; position:relative; box-shadow:0 2px 0 rgba(0,0,0,.08); border:2px solid transparent; }
  .desk.sel { border-color:#6366f1; }
  .avatar { font-size:30px; line-height:1.1; }
  .table { height:8px; background:#d6b98c; border-radius:3px; margin:4px 10px; }
  .name { font-size:11.5px; font-weight:600; margin-top:3px; word-break:keep-all; }
  .st { position:absolute; top:4px; right:4px; font-size:10px; border-radius:6px; padding:1px 6px; color:#fff; }
  .st.working { background:#2563eb } .st.waiting { background:#10b981 } .st.error { background:#ef4444 } .st.stale { background:#f59e0b }
  .st.off, .st.unknown { background:#94a3b8 } .st.nodata { background:#a78bfa } .st.on { background:#10b981 }
  .st.blip { background:#fb923c }
  .meta { font-size:10px; color:#64748b; margin-top:2px; word-break:keep-all } .meta .bad { color:#dc2626; font-weight:600 }
  .desk.off, .desk.unknown { opacity:.7 } .desk.stale { box-shadow:0 0 0 2px rgba(245,158,11,.5) }
  .desk.error { animation: blink 1s infinite; } .desk.working .avatar { animation: bob 1.2s infinite; }
  @keyframes blink { 50% { box-shadow:0 0 0 3px rgba(239,68,68,.35) } }
  @keyframes bob { 50% { transform: translateY(-2px) } }
  .zz { position:absolute; top:6px; left:8px; font-size:10px; color:#94a3b8 }
  .side { flex:0 0 300px; background:#fff; border-radius:12px; padding:12px; position:sticky; top:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .side h4 { margin:0 0 4px; font-size:14px } .side .k { color:var(--muted); font-size:11px; margin-top:8px }
  .legend { margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted) }
  .legend span::before { content:"●"; margin-right:3px }
  .l-working::before{color:#2563eb} .l-waiting::before{color:#10b981} .l-error::before{color:#ef4444} .l-stale::before{color:#f59e0b} .l-off::before{color:#94a3b8} .l-nodata::before{color:#a78bfa} .l-blip::before{color:#fb923c}
  .err { color:#b91c1c; font-size:11px; word-break:break-all }
  @media (max-width: 760px) { .wrap { flex-direction:column } .side { position:static; flex-basis:auto; width:auto } }
</style>
</head>
<body>
<div class="top">
  <div class="board"><b>BINANCE HQ</b><div>자동매매 사무실 — 팀마다 지금 무엇을 하는지</div></div>
  <div class="summary" id="summary">불러오는 중…</div>
</div>
<div class="wrap">
  <div class="office" id="office"></div>
  <div class="side" id="side"><h4>책상을 누르세요</h4><div class="k">팀을 누르면 하는 일·마지막 실행·오류를 보여 줍니다.</div></div>
</div>
<div class="legend">
  <span class="l-working">작업 중</span><span class="l-waiting">다음 실행 대기</span><span class="l-error">오류</span>
  <span class="l-blip">일시 오류(24h 1번)</span><span class="l-stale">멈춤?(주기의 3배 넘게 실행 없음)</span><span class="l-nodata">재료 없음</span><span class="l-off">꺼짐·기록 없음</span>
  <span style="margin-left:auto" id="at"></span>
</div>
<script>
// 🏢 Fix 458 (2026-10-14 사장님 「사무실 탭」) — 읽기 전용. 30초마다 갱신.
let DATA = null, SEL = null;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path) {
  if (window.opener && !window.opener.closed && typeof window.opener.api === 'function') return window.opener.api(path);
  throw new Error('부모 창이 닫혀 있습니다 — 대시보드에서 다시 여세요');
}
// 🏢 Fix 459: 「24h 오류 e/r」 · 「다음 n분 뒤」
function meta(k) {
  const parts = [];
  if (k.runs_24h != null) parts.push(`<span class="${k.errors_24h > 0 ? 'bad' : ''}">24h 오류 ${esc(k.errors_24h)}/${esc(k.runs_24h)}</span>`);
  if (k.next_run && k.next_run !== '—') parts.push(`다음 ${esc(k.next_run)}`);
  return parts.length ? `<div class="meta">${parts.join(' · ')}</div>` : '';
}
function render() {
  const d = DATA;
  if (!d || !d.rooms) return;
  const order = ['error', 'blip', 'stale', 'working', 'waiting', 'nodata', 'off', 'unknown', 'on'];
  const names = {error:'오류', blip:'일시 오류', stale:'멈춤?', working:'작업 중', waiting:'대기', nodata:'재료 없음', off:'꺼짐', unknown:'기록 없음', on:'켜짐'};
  document.getElementById('summary').innerHTML = order.filter(k => d.counts && d.counts[k])
    .map(k => `<span class="chip"><b>${names[k]}</b> ${d.counts[k]}</span>`).join('') +
    (d.other_errors && d.other_errors.length ? `<span class="chip" style="border-color:#ef4444">그 밖의 오류 잡 ${d.other_errors.length}</span>` : '');
  document.getElementById('office').innerHTML = d.rooms.map(r =>
    `<div class="room" style="background:${esc(r.color)}55"><h3>${esc(r.icon)} ${esc(r.label)}</h3><div class="desks">` +
    r.desks.map(k => `<div class="desk ${esc(k.status)} ${SEL === k.key ? 'sel' : ''}" data-k="${esc(k.key)}">` +
      `<span class="st ${esc(k.status)}">${esc(k.status_label)}</span>` +
      (k.status === 'waiting' || k.status === 'nodata' ? '<span class="zz">z z</span>' : '') +
      `<div class="avatar">${esc(k.avatar)}</div><div class="table"></div><div class="name">${esc(k.label)}</div>` +
      (k.badge ? `<div style="font-size:10px;color:#475569">${esc(k.badge)}</div>` : '') + meta(k) +
      `</div>`).join('') + `</div></div>`).join('');
  document.querySelectorAll('.desk').forEach(el => el.onclick = () => { SEL = el.dataset.k; render(); });
  document.getElementById('at').textContent = `갱신 ${d.at || ''} · 기록된 잡 ${d.jobs_recorded || 0}개`;
  const k = d.rooms.flatMap(r => r.desks).find(x => x.key === SEL);
  if (k) {
    document.getElementById('side').innerHTML = `<h4>${esc(k.avatar)} ${esc(k.label)}</h4>` +
      `<span class="st ${esc(k.status)}" style="position:static">${esc(k.status_label)}</span>` +
      `<div class="k">하는 일</div><div>${esc(k.detail)}</div>` +
      `<div class="k">마지막 실행</div><div>${esc(k.last)}${k.job ? ' · ' + esc(k.job) : ''}</div>` +
      `<div class="k">최근 24시간</div><div>${k.runs_24h != null ? `실행 ${esc(k.runs_24h)}번 · 오류 ${esc(k.errors_24h)}번` : '기록 없음(Fix 459 배포 뒤부터 셈)'}</div>` +
      `<div class="k">다음 실행</div><div>${esc(k.next_run || '—')}${k.next_run_at ? ' (' + esc(k.next_run_at) + ')' : ''}</div>` +
      (k.error ? `<div class="k">마지막 오류</div><div class="err">${esc(k.error)}</div>` : '') +
      (d.other_errors && d.other_errors.length ? `<div class="k">그 밖의 오류 잡</div><div class="err">${d.other_errors.map(esc).join(', ')}</div>` : '') +
      `<div class="k" style="margin-top:12px">※ 보기 전용 — 켜기·끄기는 관제실에서 대표님이.</div>`;
  }
}
async function load() {
  try {
    DATA = await api('/orchestra/office');
    if (DATA && DATA.error) throw new Error(DATA.error);
    render();
  } catch (e) {
    document.getElementById('summary').innerHTML = `<span class="chip" style="border-color:#ef4444">❌ ${esc(e.message || e)}</span>`;
  }
}
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
