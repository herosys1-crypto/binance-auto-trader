<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎛 자동매매 관제실</title>
<!--
  🎛 Fix 374 (2026-09-16 사장님) — 「자동매매 준비 가족 12종과 모든 자동매매를 한곳으로 모아서 사용과 관리가 편리하게 ui를 개선해줘」
  🔘 Fix 383 (2026-09-19 사장님) — 「각각 자동매매에서도 켜고 끄는 기능」 → 줄마다 바로 켜기/끄기 · 묶음마다 끄기/그림자.
  🗂 Fix 381 (2026-09-19 사장님) — 「자동매매 전략 모두 한눈에 관리할수 있게 정리해서 한줄로 순서를 정해서 나열하고
      선택하면 풀다운 메뉴로 볼수있게 정리해줘 자동매매 전략이 너무 많이 복잡해」
      → 전략 한 줄씩 · 번호 순서(서버 auto_control.LINE_ORDER) · 줄을 누르면 그 아래로 설정이 펼쳐진다.
  값은 전부 system_settings 행이라 저장 즉시 적용된다 (재시작 불필요). API = /api/v1/auto-control/*
-->
<style>
  :root {
    --bg: #0f172a; --panel: rgba(30,41,59,.55); --line: #334155; --line2: #1e293b;
    --fg: #e2e8f0; --dim: #94a3b8; --on: #22c55e; --shadow: #f59e0b; --off: #64748b;
    --danger: #ef4444; --accent: #22d3ee; --purple: #7c3aed;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); margin: 0; padding: 10px 14px 90px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }
  h1 { font-size: 17px; margin: 0; color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px;
          border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .muted { color: var(--dim); font-size: 11px; font-weight: 400; }
  .btn { background: #1e293b; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
         padding: 6px 11px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #273549; }
  .btn-primary { background: var(--purple); border-color: var(--purple); color: #fff; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-go { background: var(--on); border-color: var(--on); color: #05230f; font-weight: 700; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text].q { background: #0b1220; color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
                       padding: 5px 8px; font-size: 12px; min-width: 150px; }

  /* 맨 위 한 줄 상태 */
  .status { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
            border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; border: 1px solid; }
  .status.halted { background: rgba(239,68,68,.12); border-color: var(--danger); }
  .status.running { background: rgba(34,197,94,.12); border-color: var(--on); }
  .status .big { font-size: 14px; font-weight: 700; }
  .ks { background: rgba(245,158,11,.14); border: 1px solid var(--shadow); border-radius: 8px;
        padding: 7px 12px; margin-bottom: 8px; font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip b { font-size: 13px; }

  /* 목록 — 전략 한 줄씩 */
  .sec-title { font-size: 12px; color: var(--accent); font-weight: 700; margin: 12px 2px 4px;
               display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sec-btns { display: inline-flex; gap: 6px; }
  .mini-btn { padding: 3px 9px; font-size: 11px; }
  .quick select { min-width: 72px; min-height: 28px; padding: 3px 5px; font-size: 11.5px; }
  .item { border: 1px solid var(--line2); border-radius: 7px; margin-bottom: 4px; background: rgba(15,23,42,.45); }
  .item.is-on { border-left: 3px solid var(--on); }
  .item.is-shadow { border-left: 3px solid var(--shadow); }
  .item.is-off, .item.is-gate_only { border-left: 3px solid var(--off); }
  .item.open { border-color: var(--accent); }
  .line { display: grid; grid-template-columns: 30px auto 1fr auto auto 16px; gap: 8px; align-items: center;
          padding: 8px 10px; cursor: pointer; user-select: none; min-height: 40px; }
  .line:hover { background: rgba(34,211,238,.06); }
  .no { color: var(--dim); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .mini { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .mini b { color: var(--fg); }
  .arrow { color: var(--dim); transition: transform .15s; font-size: 11px; }
  .item.open .arrow { transform: rotate(180deg); color: var(--accent); }
  .badge { display: inline-block; border-radius: 4px; padding: 2px 7px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .b-on { background: rgba(34,197,94,.2); color: var(--on); }
  .b-shadow { background: rgba(245,158,11,.2); color: var(--shadow); }
  .b-off { background: rgba(100,116,139,.25); color: #cbd5e1; }
  .b-wait { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* 펼친 칸 */
  .drop { display: none; padding: 4px 12px 12px 48px; border-top: 1px dashed var(--line2); }
  .item.open .drop { display: block; }
  .desc { font-size: 11.5px; color: #cbd5e1; margin: 6px 0 8px; line-height: 1.5; }
  .fields { display: flex; gap: 12px; flex-wrap: wrap; }
  label.f { display: inline-flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: var(--dim); }
  label.f.main span:first-child { color: var(--fg); font-weight: 700; }
  select, input[type=number], input.txt {
    background: #0b1220; color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 7px; font-size: 12px; min-width: 84px; font-family: inherit; min-height: 30px;
  }
  input.txt { min-width: 150px; }
  .dirty { outline: 2px solid var(--accent); }
  .keyref { font-size: 10px; color: #64748b; font-family: ui-monospace, monospace; }
  .sub { font-size: 10.5px; color: var(--dim); margin: 10px 0 4px; }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: #111c31; border-top: 1px solid var(--line);
             padding: 8px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .savebar.hidden { display: none; }
  #msg { font-size: 12px; }
  .err { color: var(--danger); }
  .ok { color: var(--on); }
  table.det { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.det td { padding: 3px 6px; border-bottom: 1px solid var(--line2); }
  @media (max-width: 560px) {
    body { padding: 8px 8px 96px; }
    .line { grid-template-columns: 22px auto 1fr auto 14px; }
    .quick select { min-width: 64px; }
    .line .mini { display: none; }
    .drop { padding-left: 12px; }
    .mini-m { display: block !important; }
  }
  .mini-m { display: none; font-size: 11px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>

<div class="head">
  <div>
    <h1>🎛 자동매매 관제실</h1>
    <div class="muted" id="subtitle">불러오는 중…</div>
  </div>
  <div class="row">
    <input type="text" id="q" class="q" placeholder="전략·설정 키 검색">
    <label class="row muted" style="gap:4px"><input type="checkbox" id="only-on"> 켜진 것만</label>
    <button class="btn" onclick="openAll(true)">모두 펼치기</button>
    <button class="btn" onclick="openAll(false)">모두 접기</button>
    <button class="btn" onclick="load()">↻</button>
  </div>
</div>

<div id="status"></div>
<div id="ks"></div>
<div class="chips" id="summary"></div>
<div id="list"></div>

<div class="savebar hidden" id="savebar">
  <div id="msg"></div>
  <div class="row">
    <button class="btn" onclick="resetChanges()">되돌리기</button>
    <button class="btn btn-primary" id="save-btn" onclick="save()">💾 저장</button>
  </div>
</div>

<script src="/static/js/auto-control.js"></script>
<script>load();</script>
</body>
</html>
